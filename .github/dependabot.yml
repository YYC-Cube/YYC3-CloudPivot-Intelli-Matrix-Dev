# YYC³ CloudPivot Intelli-Matrix Dev — Dependabot 分组配置（T1 恒久减负）
# 策略：patch/minor 归组周更，绿测自动合并（dependabot-auto-merge.yml）；
#       major 保持单独 PR 认真评审。
version: 2
updates:
  # pnpm 工作区（与 pnpm-workspace.yaml 的 packages 口径一致）
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/docs/packages/*"
      - "/apps/*"
      - "/packages/*"
    schedule:
      interval: "weekly"
    groups:
      patch-and-minor:
        update-types: ["patch", "minor"]
  # GitHub Actions 版本更新（ai-eco-ci.yml）
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      patch-and-minor:
        update-types: ["patch", "minor"]
