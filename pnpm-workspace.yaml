packages:
  # docs/packages/* 为 family-* 包的权威实现（含完整引擎+架构常量）
  - "docs/packages/*"
  - "apps/*"
  - "packages/*"

# pnpm 11+: 构建脚本白名单 (allowBuilds 替代已移除的 onlyBuiltDependencies)
allowBuilds:
  "@swc/core": true
  esbuild: true

# pnpm 11+ 统一依赖覆盖（替代旧 package.json pnpm.overrides）
# 原则: override 一律锁大版本 (^x.y.z)。
# 教训: 开放式 >= 范围会被解析到大版本跳跃 — undici@8 移除 jsdom 深路径、
# ajv@8 破坏 eslint 深路径 require、brace-expansion 大版本间 API 不兼容 (expand 导出)
overrides:
  react: "^19.0.0"
  react-dom: "^19.0.0"
  # 安全: react-router <7.18.2 存在高位漏洞 (patched >=7.18.2)
  "react-router": "^7.18.2"
  "react-router-dom": "^7.18.2"
  # 安全: 传递依赖已知漏洞修复线 (锁大版本, 防深路径解析破坏)
  postcss: "^8.5.18"
  nanoid: "^3.3.16"
  browserslist: "^4.28.7"
  tar: "^7.5.21"
  path-to-regexp: "^6.3.0"
  # brace-expansion: minimatch@10 需 v5 的 expand 导出; >=5.0.12 覆盖全部已知 advisory
  "brace-expansion": ">=5.0.12"
  # undici: 锁 7.x 修复线 (jsdom@29 深路径依赖 7.x 内部结构, 禁止跳 8)
  undici: "^7.29.1"
  # tsx: postcss-load-config (tsup/vite 生态) 深路径依赖, 锁修复线
  tsx: "^4.23.13"
  # esbuild 漏洞线在 0.27.x (tsup@8.5.1 直依赖) — 选择器限定;
  # 不可全局 override: vite@6 依赖 ^0.25, 强推 0.28 会破坏 transform (destructuring 报错)
  "esbuild@>=0.27.0 <0.28.0": ">=0.28.1"

# pnpm 11+ 供应链策略: minimumReleaseAge (默认 1440 分钟=24h) 会拒绝发布不足 24h 的锁定条目,
# 导致 CI frozen install 时敏性失败 (react-router/electron-to-chromium 等日更数据包必踩)。
# 显式放宽为 60 分钟 — 保留"防发布即投毒"防线, 消除时敏 flaky
minimumReleaseAge: 60
