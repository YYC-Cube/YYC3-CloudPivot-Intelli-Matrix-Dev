name: YYC³ AI 生态系统 CI/CD

on:
  push:
    branches: [main, "feature/*", "phase/*"]
  pull_request:
    branches: [main]

# 同一分支新 push 时取消旧 run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # pnpm 版本由根 package.json 的 packageManager 字段唯一驱动 (SSOT)
  # pnpm/action-setup@v4 不传 version 时自动读取 packageManager
  NODE_VERSION: "22"

# 工作流级最小权限 (各 job 按 least-privilege 提升)
permissions:
  contents: read

jobs:
  # ============================================================
  # Job 1: 质量门禁 (类型 + Lint + 单元测试 + Family 引擎门禁)
  # ============================================================
  quality:
    name: 🔍 质量门禁 (TS + Lint + Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm (version from packageManager field)
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Verify pnpm version aligns with lockfile
        run: pnpm --version

      - name: Install deps (frozen)
        run: pnpm install --frozen-lockfile

      - name: Type Check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Unit Tests (Vitest — packages + apps)
        run: pnpm test --run

      - name: Family Engine Gate (core → agents → skills → integration)
        run: |
          pnpm --filter "@yyc3/family-core" test
          pnpm --filter "@yyc3/family-agents" test
          pnpm --filter "@yyc3/family-skills" test
          pnpm --filter "@yyc3/family-integration-tests" test

      - name: Test Coverage
        run: pnpm test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ============================================================
  # Job 2: 构建 (所有独立 App + Full App)
  # ============================================================
  build:
    name: 🏗️ 构建所有 App
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app:
          - standalone-monitor
          - standalone-ops
          - standalone-ai
          - standalone-ai-family
          - standalone-dev
          - standalone-admin
          - standalone-business
          - full
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm (version from packageManager field)
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install deps (frozen)
        run: pnpm install --frozen-lockfile

      - name: Build @yyc3/app-${{ matrix.app }}
        run: pnpm --filter "@yyc3/app-${{ matrix.app }}" build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.app }}
          path: apps/${{ matrix.app == 'full' && 'full' || matrix.app }}/dist/
          retention-days: 3

  # ============================================================
  # Job 3: E2E 测试 (Playwright)
  # ============================================================
  e2e:
    name: 🎭 E2E 测试 (Playwright)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm (version from packageManager field)
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install deps (frozen)
        run: pnpm install --frozen-lockfile

      - name: Download full app build
        uses: actions/download-artifact@v4
        with:
          name: build-full
          path: apps/full/dist/

      - name: Install Playwright browsers
        run: pnpm playwright:install

      - name: Run E2E
        run: pnpm test:e2e

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # ============================================================
  # Job 4: 安全审计 (依赖扫描 + 密钥扫描)
  # 门禁语义: audit/Gitleaks 失败 = 阻塞 (security 进入 deploy needs 链)
  # Snyk 可选 (无 Token 时自动跳过), 失败不阻塞但产出趋势报告
  # ============================================================
  security:
    name: 🔒 安全审计
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Gitleaks 需要完整历史以扫描全部 commit

      - name: Setup pnpm (version from packageManager field)
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install deps (frozen)
        run: pnpm install --frozen-lockfile

      - name: pnpm audit (high/critical — 阻塞门禁)
        run: |
          pnpm audit --audit-level=high --json > audit-report.json || AUDIT_FAILED=1
          pnpm audit --audit-level=high
          if [ "${AUDIT_FAILED:-0}" -eq 1 ]; then
            echo "::error::pnpm audit 发现 high/critical 漏洞, 阻塞合并"
            exit 1
          fi

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: audit-report.json
          retention-days: 30

      - name: Snyk security scan (可选 — 无 Token 自动跳过)
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --org=yyc3
        continue-on-error: true

      - name: Secret scan (Gitleaks — 阻塞门禁)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # Job 5: Lighthouse 性能基线 (仅 PR 报告, 不阻塞部署)
  # ============================================================
  lighthouse:
    name: ⚡ Lighthouse 性能基线
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    if: github.event_name == 'pull_request'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Download full app build
        uses: actions/download-artifact@v4
        with:
          name: build-full
          path: apps/full/dist/

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

  # ============================================================
  # Job 6: Docker 构建验证 (main / phase/*)
  # ============================================================
  docker:
    name: 🐳 Docker 构建验证
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/phase/')
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: yyc3-ai-ecosystem:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # Job 7: 部署到 Vercel (main 推送时)
  # 依赖硬性门禁: quality/build/e2e/security/docker
  # (lighthouse 为 PR 报告性质, 不阻塞生产部署)
  # ============================================================
  deploy:
    name: 🚀 部署 Vercel (生产)
    runs-on: ubuntu-latest
    needs: [quality, build, e2e, security, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        id: deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
          scope: ${{ secrets.VERCEL_ORG_ID }}

  # ============================================================
  # Job 8: 插件完整性检查 (所有插件 index.ts 存在)
  # ============================================================
  ecosystem-check:
    name: 🌐 插件完整性检查
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check all plugins
        run: |
          echo "🔍 检查所有插件的 index.ts"
          fail=0
          for dir in packages/plugin-*; do
            plugin=$(basename "$dir")
            if [ ! -f "packages/$plugin/src/index.ts" ]; then
              echo "❌ Missing: $plugin/src/index.ts"
              fail=1
            else
              echo "✅ $plugin OK"
            fi
          done
          [ "$fail" -eq 0 ] && echo "🎉 所有插件完整性检查通过" || exit 1
