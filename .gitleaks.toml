# ============================================================
# Gitleaks 项目级配置 — 项目特定误报 allowlist
# 目的: 保留 gitleaks 默认全部规则 (不减弱检测面), 仅对已核实为
#       非密钥的代码模式精准豁免, 避免 CI 阻塞门禁误报。
# 修改前必须在本地实测: gitleaks detect --log-opts="--all"
# ============================================================
[extend]
# 继承 gitleaks 内置默认规则集 (不覆盖 default 阻塞行为)
useDefault = true

[allowlist]
description = "已核实的非密钥模式 — localStorage 存储键名"
# yyc3-* 为 localStorage/i18n 存储 key 前缀 (如 yyc3-family-activities),
# 高熵字符串被 generic-api-key 规则误判为密钥 (实测 3 处: LocalPersister/
# FamilyVoiceSystem/FamilyUISettings, 全部为 storageKey 字面量)
regexes = [
  '''yyc3-[a-z0-9-]+''',
]
# 说明文件中的占位符密钥样式 (sk-xxx... 等 placeholder)
paths = [
  '''(?i)\.(md|txt)$''',
]
