name: YYC³ AI 生态系统 CI/CD

on:
  push:
    branches: [main, "feature/*", "phase/*"]
  pull_request:
    branches: [main]

# 同一分支新 push 时取消旧 run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9.15.0"

jobs:
  # ============================================================
  # Job 1: 质量门禁 (类型 + Lint + 单元测试)
  # ============================================================
  quality:
    name: 🔍 质量门禁 (TS + Lint + Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Type Check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Unit Tests (Vitest)
        run: pnpm test --run

      - name: Test Coverage
        run: pnpm test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ============================================================
  # Job 2: 构建 (所有独立 App + Full App)
  # ============================================================
  build:
    name: 🏗️ 构建所有 App
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app:
          - standalone-monitor
          - standalone-ops
          - standalone-ai
          - standalone-ai-family
          - standalone-dev
          - standalone-admin
          - standalone-dynasty
          - full
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build @yyc3/app-${{ matrix.app }}
        run: pnpm --filter "@yyc3/app-${{ matrix.app }}" build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.app }}
          path: apps/${{ matrix.app == 'full' && 'full' || matrix.app }}/dist/
          retention-days: 3

  # ============================================================
  # Job 3: E2E 测试 (Playwright)
  # ============================================================
  e2e:
    name: 🎭 E2E 测试 (Playwright)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Download full app build
        uses: actions/download-artifact@v4
        with:
          name: build-full
          path: apps/full/dist/

      - name: Install Playwright browsers
        run: pnpm playwright:install

      - name: Run E2E
        run: pnpm test:e2e

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # ============================================================
  # Job 4: 安全审计 (依赖扫描)
  # ============================================================
  security:
    name: 🔒 安全审计
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: pnpm audit (high/critical)
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Snyk security scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --org=yyc3
        continue-on-error: true

      - name: Secret scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # ============================================================
  # Job 5: Lighthouse 性能基线
  # ============================================================
  lighthouse:
    name: ⚡ Lighthouse 性能基线
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Download full app build
        uses: actions/download-artifact@v4
        with:
          name: build-full
          path: apps/full/dist/

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

  # ============================================================
  # Job 6: Docker 构建验证 (main / phase/*)
  # ============================================================
  docker:
    name: 🐳 Docker 构建验证
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/phase/')
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: yyc3-ai-ecosystem:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # Job 7: 部署到 Vercel (main 推送时)
  # ============================================================
  deploy:
    name: 🚀 部署 Vercel (生产)
    runs-on: ubuntu-latest
    needs: [quality, build, e2e, security, lighthouse]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        id: deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
          scope: ${{ secrets.VERCEL_ORG_ID }}

  # ============================================================
  # Job 8: 插件完整性检查 (所有插件 register.ts 存在)
  # ============================================================
  ecosystem-check:
    name: 🌐 插件完整性检查
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Verify file structure
        run: node validate-ecosystem.js || true

      - name: Check all plugins
        run: |
          echo "🔍 检查所有插件的 register.ts + index.ts"
          for plugin in plugin-ai-family plugin-dynasty plugin-monitor plugin-ops plugin-ai plugin-dev plugin-admin plugin-target plugin-cost plugin-marketing plugin-prompt plugin-llm; do
            if [ -d "packages/$plugin" ]; then
              test -f "packages/$plugin/src/index.ts" || (echo "❌ Missing: $plugin/src/index.ts" && exit 1)
              echo "✅ $plugin OK"
            fi
          done
          echo "🎉 所有插件完整性检查通过"
