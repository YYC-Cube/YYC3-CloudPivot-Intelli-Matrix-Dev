<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>YYC³ AI Family Skills 中心</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%238b5cf6'/%3E%3Cstop offset='100%25' stop-color='%2306b6d4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='6' fill='url(%23g)'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-size='18' font-weight='700' font-family='sans-serif' fill='%23fff'%3EY%3C/text%3E%3C/svg%3E"
    />
    <style>
      /* ═══════════════════════════════════════════
   CSS Variables & Theme
   ═══════════════════════════════════════════ */
      :root {
        --bg: #0a0a0f;
        --bg2: #12121a;
        --bg3: #1a1a2e;
        --surface: rgba(255, 255, 255, 0.03);
        --surface-hover: rgba(255, 255, 255, 0.06);
        --border: rgba(255, 255, 255, 0.08);
        --border-hover: rgba(255, 255, 255, 0.15);
        --text: #f1f1f6;
        --text2: rgba(255, 255, 255, 0.65);
        --text3: rgba(255, 255, 255, 0.35);
        --accent-v: #8b5cf6;
        --accent-c: #06b6d4;
        --accent-e: #22c55e;
        --accent-r: #ef4444;
        --accent-o: #f59e0b;
        --radius: 14px;
        --radius-sm: 8px;
        --shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
        --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', 'Consolas', monospace;
      }
      .light {
        --bg: #f5f5f0;
        --bg2: #e8e8e3;
        --bg3: #ddd;
        --surface: rgba(0, 0, 0, 0.02);
        --surface-hover: rgba(0, 0, 0, 0.05);
        --border: rgba(0, 0, 0, 0.08);
        --border-hover: rgba(0, 0, 0, 0.15);
        --text: #1a1a2e;
        --text2: rgba(0, 0, 0, 0.55);
        --text3: rgba(0, 0, 0, 0.3);
        --shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        font-family: var(--font);
        background: var(--bg);
        color: var(--text);
        overflow-x: hidden;
      }
      ::selection {
        background: rgba(139, 92, 246, 0.3);
        color: #fff;
      }

      /* ═══ Layout ═══ */
      .app {
        display: flex;
        min-height: 100vh;
      }

      /* ═══ Sidebar ═══ */
      .sidebar {
        width: 280px;
        flex-shrink: 0;
        background: var(--bg2);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        z-index: 100;
        transition: transform 0.3s ease;
      }
      .sidebar.hidden {
        transform: translateX(-100%);
      }
      .sb-header {
        padding: 20px 20px 16px;
        border-bottom: 1px solid var(--border);
      }
      .sb-logo {
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
      }
      .sb-logo-icon {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        background: linear-gradient(135deg, var(--accent-v), var(--accent-c));
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        font-weight: 700;
        color: #fff;
      }
      .sb-logo-text {
        font-size: 15px;
        font-weight: 700;
        color: var(--text);
      }
      .sb-logo-sub {
        font-size: 10px;
        color: var(--text3);
        letter-spacing: 1px;
      }
      .sb-search {
        margin: 12px 16px;
        padding: 8px 12px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        display: flex;
        align-items: center;
        gap: 8px;
        transition: 0.2s;
      }
      .sb-search:focus-within {
        border-color: var(--accent-v);
      }
      .sb-search input {
        flex: 1;
        background: none;
        border: none;
        outline: none;
        color: var(--text);
        font-size: 13px;
      }
      .sb-search input::placeholder {
        color: var(--text3);
      }
      .sb-search svg {
        width: 14px;
        height: 14px;
        color: var(--text3);
        flex-shrink: 0;
      }

      /* ═══ Sidebar Progress ═══ */
      .sb-progress {
        margin: 0 16px 12px;
        padding: 10px 12px;
        border-radius: var(--radius-sm);
        background: var(--surface);
        border: 1px solid var(--border);
      }
      .sb-progress-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 6px;
      }
      .sb-progress-label {
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: var(--text3);
      }
      .sb-progress-pct {
        font-size: 11px;
        font-weight: 700;
        color: var(--accent-v);
      }
      .sb-progress-bar {
        height: 4px;
        border-radius: 2px;
        background: var(--border);
        overflow: hidden;
        margin-bottom: 4px;
      }
      .sb-progress-fill {
        height: 100%;
        border-radius: 2px;
        background: linear-gradient(90deg, var(--accent-v), var(--accent-c));
        transition: width 0.6s ease;
      }
      .sb-progress-count {
        font-size: 10px;
        color: var(--text3);
      }
      .sb-nav {
        flex: 1;
        overflow-y: auto;
        padding: 8px 12px 20px;
      }
      .sb-nav::-webkit-scrollbar {
        width: 4px;
      }
      .sb-nav::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 2px;
      }
      .sb-group-title {
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--text3);
        padding: 16px 8px 6px;
      }
      .sb-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 7px 10px;
        border-radius: var(--radius-sm);
        cursor: pointer;
        transition: 0.15s;
        text-decoration: none;
        color: var(--text2);
        font-size: 13px;
        margin-bottom: 2px;
      }
      .sb-item:hover {
        background: var(--surface);
        color: var(--text);
      }
      .sb-item.active {
        background: rgba(139, 92, 246, 0.12);
        color: var(--accent-v);
        font-weight: 600;
      }
      .sb-item-icon {
        font-size: 14px;
        width: 20px;
        text-align: center;
        flex-shrink: 0;
      }
      .sb-item-text {
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .sb-item-badge {
        font-size: 9px;
        padding: 1px 6px;
        border-radius: 4px;
        font-weight: 700;
        flex-shrink: 0;
      }

      /* ═══ Main ═══ */
      .main {
        flex: 1;
        margin-left: 280px;
        min-height: 100vh;
        transition: margin 0.3s ease;
      }
      .main.full {
        margin-left: 0;
      }

      /* ═══ Topbar ═══ */
      .topbar {
        position: sticky;
        top: 0;
        z-index: 50;
        background: rgba(10, 10, 15, 0.8);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 24px;
      }
      .light .topbar {
        background: rgba(245, 245, 240, 0.8);
      }
      .topbar-title {
        font-size: 15px;
        font-weight: 700;
      }
      .topbar-subtitle {
        font-size: 11px;
        color: var(--text3);
      }
      .btn-menu {
        width: 34px;
        height: 34px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text2);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: 0.2s;
      }
      .btn-menu:hover {
        background: var(--surface-hover);
        color: var(--text);
      }
      .btn-menu svg {
        width: 16px;
        height: 16px;
      }
      .topbar-spacer {
        flex: 1;
      }
      .topbar-time {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--text3);
        font-family: var(--font-mono);
      }
      .tt-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent-e);
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }

      /* Share button */
      .btn-share {
        width: 34px;
        height: 34px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text2);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: 0.2s;
      }
      .btn-share:hover {
        background: var(--surface-hover);
        color: var(--accent-v);
        border-color: rgba(139, 92, 246, 0.3);
      }
      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .btn-theme {
        width: 34px;
        height: 34px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text2);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: 0.2s;
      }
      .btn-theme:hover {
        background: var(--surface-hover);
        color: var(--text);
      }
      .btn-theme svg {
        width: 16px;
        height: 16px;
      }
      .progress-actions {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .btn-action {
        width: 30px;
        height: 30px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text2);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: 0.2s;
      }
      .btn-action:hover {
        background: var(--surface-hover);
        color: var(--text);
      }
      .btn-action.btn-danger:hover {
        background: rgba(239, 68, 68, 0.12);
        color: #ef4444;
        border-color: rgba(239, 68, 68, 0.3);
      }

      /* ═══ Dashboard ═══ */
      .dashboard {
        padding: 24px;
        max-width: 1400px;
        margin: 0 auto;
      }
      .dash-header {
        margin-bottom: 32px;
      }
      .dash-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 12px;
        border-radius: 20px;
        background: rgba(139, 92, 246, 0.12);
        color: var(--accent-v);
        font-size: 11px;
        font-weight: 600;
        margin-bottom: 8px;
      }
      .dash-title {
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 6px;
        line-height: 1.2;
      }
      .dash-desc {
        font-size: 14px;
        color: var(--text2);
        max-width: 600px;
        line-height: 1.5;
      }
      .dash-stats {
        display: flex;
        gap: 16px;
        margin-top: 20px;
        flex-wrap: wrap;
      }
      .stat-card {
        padding: 12px 18px;
        border-radius: var(--radius-sm);
        background: var(--surface);
        border: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .stat-num {
        font-size: 20px;
        font-weight: 700;
      }
      .stat-label {
        font-size: 11px;
        color: var(--text2);
      }

      /* ═══ Filter bar ═══ */
      .filter-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 24px;
      }
      .filter-btn {
        padding: 6px 14px;
        border-radius: 20px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text2);
        font-size: 12px;
        cursor: pointer;
        transition: 0.2s;
        font-weight: 500;
      }
      .filter-btn:hover {
        border-color: var(--border-hover);
        color: var(--text);
      }
      .filter-btn.active {
        background: var(--accent-v);
        color: #fff;
        border-color: var(--accent-v);
      }
      .filter-btn[data-cat='all'].active {
        background: var(--text);
        color: var(--bg);
        border-color: var(--text);
      }

      /* ═══ Category section ═══ */
      .cat-section {
        margin-bottom: 36px;
      }
      .cat-header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 14px;
      }
      .cat-icon {
        font-size: 20px;
      }
      .cat-name {
        font-size: 16px;
        font-weight: 600;
      }
      .cat-count {
        font-size: 12px;
        color: var(--text3);
      }
      .cat-line {
        flex: 1;
        height: 1px;
        background: var(--border);
      }

      /* ═══ Card grid ═══ */
      .card-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 14px;
      }
      .guide-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 18px;
        cursor: pointer;
        transition: all 0.25s ease;
        text-decoration: none;
        display: block;
        color: inherit;
        position: relative;
        overflow: hidden;
        animation: fadeUp 0.4s ease both;
      }
      .guide-card:hover {
        transform: translateY(-2px);
        border-color: var(--border-hover);
        box-shadow: var(--shadow);
      }
      .guide-card.hidden {
        display: none;
      }
      .guide-card .gc-bar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
      }
      .gc-head {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        margin-bottom: 10px;
      }
      .gc-icon {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
      }
      .gc-info {
        flex: 1;
        min-width: 0;
      }
      .gc-title {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 2px;
        line-height: 1.3;
      }
      .gc-meta {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .gc-tag {
        font-size: 10px;
        padding: 1px 7px;
        border-radius: 4px;
        font-weight: 600;
      }
      .gc-tag-diff-easy {
        background: rgba(34, 197, 94, 0.15);
        color: var(--accent-e);
      }
      .gc-tag-diff-medium {
        background: rgba(245, 158, 11, 0.15);
        color: var(--accent-o);
      }
      .gc-tag-diff-hard {
        background: rgba(239, 68, 68, 0.15);
        color: var(--accent-r);
      }
      .gc-desc {
        font-size: 12px;
        color: var(--text2);
        line-height: 1.5;
        margin-bottom: 10px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .gc-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 11px;
        color: var(--text3);
      }
      .gc-time {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .gc-owner {
        display: flex;
        align-items: center;
        gap: 4px;
        font-weight: 600;
      }
      .gc-new-badge {
        position: absolute;
        top: 8px;
        right: 8px;
        font-size: 9px;
        padding: 2px 8px;
        border-radius: 4px;
        background: linear-gradient(135deg, var(--accent-v), var(--accent-c));
        color: #fff;
        font-weight: 700;
        letter-spacing: 0.5px;
      }

      /* ═══ Skill detail view ═══ */
      .skill-detail {
        display: none;
        padding: 24px;
        max-width: 900px;
        margin: 0 auto;
      }
      .skill-detail.active {
        display: block;
      }
      .sd-back {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--text2);
        cursor: pointer;
        margin-bottom: 20px;
        padding: 6px 12px;
        border-radius: var(--radius-sm);
        background: var(--surface);
        border: 1px solid var(--border);
        transition: 0.2s;
        text-decoration: none;
      }
      .sd-back:hover {
        color: var(--text);
        border-color: var(--border-hover);
      }
      .sd-header {
        margin-bottom: 24px;
      }
      .sd-icon-row {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 12px;
      }
      .sd-icon {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
      }
      .sd-title {
        font-size: 22px;
        font-weight: 700;
      }
      .sd-subtitle {
        font-size: 13px;
        color: var(--text3);
        font-family: var(--font-mono);
      }
      .sd-desc {
        font-size: 14px;
        color: var(--text2);
        line-height: 1.6;
      }
      .sd-tags {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 12px;
      }
      .sd-section-title {
        font-size: 14px;
        font-weight: 700;
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .sd-params {
        display: grid;
        grid-template-columns: 1fr;
        gap: 8px;
        margin-bottom: 24px;
      }
      .sd-param {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 10px 14px;
        border-radius: var(--radius-sm);
        background: var(--surface);
        border: 1px solid var(--border);
      }
      .sd-param-name {
        font-size: 13px;
        font-weight: 700;
        color: var(--accent-c);
        font-family: var(--font-mono);
        flex-shrink: 0;
        min-width: 100px;
      }
      .sd-param-desc {
        font-size: 12px;
        color: var(--text2);
        flex: 1;
      }
      .sd-param-type {
        font-size: 10px;
        padding: 1px 6px;
        border-radius: 4px;
        background: var(--border);
        color: var(--text3);
        font-family: var(--font-mono);
      }
      .sd-code-block {
        background: var(--bg3);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 14px 16px;
        font-family: var(--font-mono);
        font-size: 12px;
        line-height: 1.6;
        overflow-x: auto;
        margin-bottom: 24px;
        color: var(--text2);
      }
      .sd-code-block .keyword {
        color: var(--accent-v);
      }
      .sd-code-block .string {
        color: var(--accent-e);
      }
      .sd-code-block .comment {
        color: var(--text3);
      }

      /* ═══ Family member cards ═══ */
      .member-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 14px;
        margin-bottom: 36px;
      }
      .member-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 18px;
        transition: all 0.25s ease;
        position: relative;
        overflow: hidden;
        animation: fadeUp 0.4s ease both;
      }
      .member-card:hover {
        transform: translateY(-2px);
        border-color: var(--border-hover);
        box-shadow: var(--shadow);
      }
      .member-card .mc-bar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
      }
      .mc-head {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 10px;
      }
      .mc-avatar {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
      }
      .mc-name {
        font-size: 15px;
        font-weight: 700;
      }
      .mc-role {
        font-size: 11px;
        color: var(--text3);
      }
      .mc-motto {
        font-size: 12px;
        color: var(--text2);
        line-height: 1.5;
        font-style: italic;
        margin-bottom: 12px;
      }
      .mc-stats {
        display: flex;
        gap: 12px;
        margin-bottom: 10px;
      }
      .mc-stat {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 11px;
        color: var(--text3);
      }
      .mc-stat strong {
        color: var(--text);
        font-size: 14px;
      }

          const count = SKILLS.filter((s) => s.cat === cat.id).length;
          html += `<a class="sb-item" onclick="filterByCategory('${cat.id}')" data-nav="${cat.id}">
      <span class="sb-item-icon">${cat.icon}</span>
      <span class="sb-item-text">${cat.name}</span>
      <span class="sb-item-badge" style="background:${cat.color}22;color:${cat.color}">${count}</span>
    </a>`;
        }

        // NVIDIA Catalog
        html += `<div class="sb-group-title">NVIDIA 目录</div>`;
        html += `<a class="sb-item" onclick="showNvidiaCatalog()" data-nav="nvcat">
    <span class="sb-item-icon">💚</span>
    <span class="sb-item-text">198 条技能目录</span>
    <span class="sb-item-badge" style="background:#76b90022;color:#76b900">32</span>
  </a>`;

        nav.innerHTML = html;
      }

      function renderStats() {
        const el = document.getElementById('dashStats');
        const newCount = SKILLS.filter((s) => s.isNew).length;
        const exclusiveCount = SKILLS.filter((s) => s.exclusive).length;
        const nvidiaCount = SKILLS.filter((s) => s.nvidia).length;
        el.innerHTML = `
    <div class="stat-card"><span class="stat-num" style="color:var(--accent-v)">${SKILLS.length}</span><span class="stat-label">封装技能</span></div>
    <div class="stat-card"><span class="stat-num" style="color:var(--accent-c)">8</span><span class="stat-label">家人</span></div>
    <div class="stat-card"><span class="stat-num" style="color:var(--accent-e)">${CATEGORIES.length}</span><span class="stat-label">分类</span></div>
    <div class="stat-card"><span class="stat-num" style="color:#f59e0b">${newCount}</span><span class="stat-label">新增技能</span></div>
    <div class="stat-card"><span class="stat-num" style="color:#76b900">198</span><span class="stat-label">NVIDIA 目录</span></div>
  `;
      }

      function renderFilterBar() {
        const el = document.getElementById('filterBar');
        let html = `<button class="filter-btn active" data-cat="all" onclick="filterByCategory('all')">全部 ${SKILLS.length}</button>`;
        for (const cat of CATEGORIES) {
          const count = SKILLS.filter((s) => s.cat === cat.id).length;
          html += `<button class="filter-btn" data-cat="${cat.id}" onclick="filterByCategory('${cat.id}')">${cat.icon} ${cat.name.split(' ')[0]} ${count}</button>`;
        }
        el.innerHTML = html;
      }

      function renderDashboard(catFilter = 'all') {
        const el = document.getElementById('dashboardContent');
        let html = '';

        // Group by category if 'all', otherwise show single category
        const cats = catFilter === 'all' ? CATEGORIES : CATEGORIES.filter((c) => c.id === catFilter);

        for (const cat of cats) {
          const skills = SKILLS.filter((s) => s.cat === cat.id && matchSearch(s));
          if (skills.length === 0) continue;

          html += `<div class="cat-section" data-cat="${cat.id}">
      <div class="cat-header">
        <span class="cat-icon">${cat.icon}</span>
        <span class="cat-name">${cat.name}</span>
        <span class="cat-count">${skills.length} 项</span>
        <span class="cat-line"></span>
      </div>
      <div class="card-grid">`;

          for (const skill of skills) {
            const member = getMember(skill.owner);
            const memberColor = member ? member.color : '#888';
            html += renderSkillCard(skill, member, cat.color);
          }
          html += `</div></div>`;
        }

        if (html === '') {
          html = `<div class="loading"><p>未找到匹配技能</p></div>`;
        }

        el.innerHTML = html;
      }

      function renderSkillCard(skill, member, catColor) {
        const diffTag = `gc-tag-diff-${skill.diff}`;
        const newBadge = skill.isNew ? `<span class="gc-new-badge">NEW</span>` : '';
        const exclusiveTag = skill.exclusive
          ? `<span class="gc-tag" style="background:rgba(139,92,246,0.15);color:#a78bfa">专属</span>`
          : '';
        const nvidiaTag = skill.nvidia
          ? `<span class="gc-tag" style="background:rgba(118,185,0,0.15);color:#76b900">NVIDIA</span>`
          : '';

        return `<a class="guide-card" href="#" onclick="showSkillDetail('${skill.id}');return false" data-cat="${skill.cat}" data-diff="${skill.diff}">
    ${newBadge}
    <div class="gc-bar" style="background:${catColor}"></div>
    <div class="gc-head">
      <div class="gc-icon" style="background:${catColor}22">${skill.icon}</div>
      <div class="gc-info">
        <div class="gc-title">${skill.id}</div>
        <div class="gc-meta">
          <span class="gc-tag ${diffTag}">${skill.diff}</span>
          ${exclusiveTag}${nvidiaTag}
        </div>
      </div>
    </div>
    <div class="gc-desc">${skill.desc}</div>
    <div class="gc-footer">
      <div class="gc-owner"><span>${member.icon}</span> ${member.name}</div>
      <div class="gc-time">${skill.params.length} 参数</div>
    </div>
  </a>`;
      }

      function showSkillDetail(skillId) {
        const skill = SKILLS.find((s) => s.id === skillId);
        if (!skill) return;
        const member = getMember(skill.owner);
        const cat = getCat(skill.cat);

        document.getElementById('dashboardView').style.display = 'none';
        document.getElementById('skillDetail').classList.add('active');

        let paramsHtml = '';
        for (const p of skill.params) {
          paramsHtml += `<div class="sd-param">
      <div class="sd-param-name">${p.name}${p.required ? '*' : ''}</div>
      <div class="sd-param-desc">${p.desc}</div>
      <div class="sd-param-type">${p.type}</div>
    </div>`;
        }

        const codeExample = generateCodeExample(skill);

        document.getElementById('skillDetail').innerHTML = `
    <a class="sd-back" onclick="showDashboard()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      返回面板
    </a>
    <div class="sd-header">
      <div class="sd-icon-row">
        <div class="sd-icon" style="background:${cat.color}22">${skill.icon}</div>
        <div>
          <div class="sd-title">${skill.id}</div>
          <div class="sd-subtitle">${member.icon} ${member.name} · ${cat.name}</div>
        </div>
      </div>
      <div class="sd-desc">${skill.desc}</div>
      <div class="sd-tags">
        <span class="gc-tag gc-tag-diff-${skill.diff}">${skill.diff}</span>
        ${skill.isNew ? '<span class="gc-tag" style="background:linear-gradient(135deg,#8b5cf6,#06b6d4);color:#fff;font-weight:700">新增</span>' : ''}
        ${skill.exclusive ? '<span class="gc-tag" style="background:rgba(139,92,246,0.15);color:#a78bfa">专属技能</span>' : ''}
        ${skill.nvidia ? '<span class="gc-tag" style="background:rgba(118,185,0,0.15);color:#76b900">NVIDIA 封装</span>' : ''}
      </div>
    </div>
    <div class="sd-section-title">📋 参数定义</div>
    <div class="sd-params">${paramsHtml}</div>
    <div class="sd-section-title">💻 代码示例</div>
    <pre class="sd-code-block">${codeExample}</pre>
  `;

        document.getElementById('topbarTitle').textContent = skill.id;
        document.getElementById('topbarSubtitle').textContent = `${member.name} · ${skill.params.length} 参数`;
      }

      function generateCodeExample(skill) {
        const params = skill.params.map((p) => `  ${p.name}: ${getParamExample(p)}`).join(',\n');
        return `<span class="comment">// 调用 ${skill.id}</span>
<span class="keyword">import</span> { ${toCamelCase(skill.id.split(':')[1])} } <span class="keyword">from</span> <span class="string">'@yyc3/family-skills'</span>;

<span class="keyword">const</span> result = <span class="keyword">await</span> ${toCamelCase(skill.id.split(':')[1])}({
${params}
});`;
      }

      function getParamExample(p) {
        if (p.type === 'string') return `<span class="string">'example'</span>`;
        if (p.type === 'number') return `<span class="string">100</span>`;
        if (p.type === 'array') return `<span class="string">[]</span>`;
        if (p.type === 'object') return `<span class="string">{}</span>`;
        return `<span class="string">'value'</span>`;
      }

      function toCamelCase(s) {
        return s.replace(/-([a-z])/g, (_, c) => c.toUpperCase());
      }

      function showDashboard() {
        document.getElementById('dashboardView').style.display = 'block';
        document.getElementById('skillDetail').classList.remove('active');
        document.getElementById('topbarTitle').textContent = 'YYC³ AI Family Skills 中心';
        document.getElementById('topbarSubtitle').textContent = '8 位家人 · 63 封装技能 · 198 NVIDIA 目录';
        updateNavActive('dashboard');
        currentFilter = 'all';
        updateFilterButtons();
        renderDashboard('all');
      }

      function showMembers() {
        document.getElementById('dashboardView').style.display = 'block';
        document.getElementById('skillDetail').classList.remove('active');
        document.getElementById('topbarTitle').textContent = '八位家人档案';
        document.getElementById('topbarSubtitle').textContent = 'YYC³ AI Family · 八层架构';

        let html =
          '<div class="cat-section"><div class="cat-header"><span class="cat-icon">👨‍👩‍👧‍👦</span><span class="cat-name">八位家人</span><span class="cat-line"></span></div><div class="member-grid">';
        for (const m of MEMBERS) {
          const skills = SKILLS.filter((s) => s.owner === m.id);
          html += `<div class="member-card">
      <div class="mc-bar" style="background:${m.color}"></div>
      <div class="mc-head">
        <div class="mc-avatar" style="background:${m.color}22">${m.icon}</div>
        <div>
          <div class="mc-name">${m.name}</div>
          <div class="mc-role">第${m.layer}层 · ${m.layerName} · ${m.role}</div>
        </div>
      </div>
      <div class="mc-motto">"${m.motto}"</div>
      <div class="mc-stats">
        <div class="mc-stat"><strong>${skills.length}</strong> 技能</div>
        <div class="mc-stat"><strong>${m.nvCount}</strong> NVIDIA</div>
      </div>
      <div class="mc-skills">${skills.map((s) => `<span class="mc-skill-tag">${s.id.split(':')[1]}</span>`).join('')}</div>
    </div>`;
        }
        html += '</div></div>';
        document.getElementById('dashboardContent').innerHTML = html;
        updateNavActive('members');
      }

      function showNvidiaCatalog() {
        document.getElementById('dashboardView').style.display = 'block';
        document.getElementById('skillDetail').classList.remove('active');
        document.getElementById('topbarTitle').textContent = 'NVIDIA Skills 目录';
        document.getElementById('topbarSubtitle').textContent = '32 组件 · 198 条技能 · 静态 catalog';

        const nvidiaMembers = MEMBERS.filter((m) => m.nvCount > 0);
        let html =
          '<div class="cat-section"><div class="cat-header"><span class="cat-icon">💚</span><span class="cat-name">NVIDIA 组件分布</span><span class="cat-line"></span></div><div class="member-grid">';
        for (const m of nvidiaMembers) {
          html += `<div class="member-card">
      <div class="mc-bar" style="background:${m.color}"></div>
      <div class="mc-head">
        <div class="mc-avatar" style="background:${m.color}22">${m.icon}</div>
        <div>
          <div class="mc-name">${m.name}</div>
          <div class="mc-role">${m.role}</div>
        </div>
      </div>
      <div class="mc-motto">"${m.motto}"</div>
      <div class="mc-stats">
        <div class="mc-stat"><strong>${m.nvCount}</strong> 条技能</div>
      </div>
    </div>`;
        }
        html += '</div></div>';

        // NVIDIA encapsulated skills
        html +=
          '<div class="cat-section"><div class="cat-header"><span class="cat-icon">⚡</span><span class="cat-name">封装技能 (8)</span><span class="cat-line"></span></div><div class="card-grid">';
        for (const skill of SKILLS.filter((s) => s.nvidia)) {
          const member = getMember(skill.owner);
          html += renderSkillCard(skill, member, '#76b900');
        }
        html += '</div></div>';

        document.getElementById('dashboardContent').innerHTML = html;
        updateNavActive('nvcat');
      }

      function filterByCategory(cat) {
        currentFilter = cat;
        document.getElementById('dashboardView').style.display = 'block';
        document.getElementById('skillDetail').classList.remove('active');
        updateFilterButtons();
        renderDashboard(cat);
        updateNavActive(cat);
        const c = getCat(cat);
        if (c) {
          document.getElementById('topbarTitle').textContent = c.name;
          document.getElementById('topbarSubtitle').textContent =
            `${SKILLS.filter((s) => s.cat === cat).length} 项技能`;
        }
      }

      function updateFilterButtons() {
        document.querySelectorAll('.filter-btn').forEach((btn) => {
          btn.classList.toggle('active', btn.dataset.cat === currentFilter);
        });
      }

      function updateNavActive(nav) {
        document.querySelectorAll('.sb-item').forEach((item) => {
          item.classList.toggle('active', item.dataset.nav === nav);
        });
      }

      function matchSearch(skill) {
        if (!currentSearch) return true;
        const q = currentSearch.toLowerCase();
        return skill.id.toLowerCase().includes(q) || skill.desc.toLowerCase().includes(q);
      }

      function filterSidebar(val) {
        currentSearch = val;
        renderDashboard(currentFilter);
      }

      function toggleSidebar() {
        const sb = document.getElementById('sidebar');
        const ov = document.getElementById('sbOverlay');
        const main = document.getElementById('main');
        const isMobile = window.innerWidth <= 768;

        if (isMobile) {
          // 移动端：滑入/滑出 + 遮罩
          sb.classList.toggle('show');
          ov.classList.toggle('active');
        } else {
          // 桌面端：折叠/展开
          sb.classList.toggle('hidden');
          main.classList.toggle('full');
        }
      }

      function toggleTheme() {
        document.body.classList.toggle('light');
      }

      function sharePage() {
        const url = window.location.href;
        if (navigator.share) {
          navigator.share({ title: 'YYC³ AI Family Skills 中心', url }).catch(() => copyToClipboard(url));
        } else {
          copyToClipboard(url);
        }
      }

      function copyLink() {
        copyToClipboard(window.location.href);
      }

      function copyToClipboard(text) {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(text).then(() => showToast('已复制到剪贴板'));
        } else {
          const ta = document.createElement('textarea');
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          showToast('已复制到剪贴板');
        }
      }

      function downloadPage() {
        const html = document.documentElement.outerHTML;
        const blob = new Blob([html], { type: 'text/html' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'YYC3-Family-Skills-Showcase.html';
        a.click();
        URL.revokeObjectURL(a.href);
        showToast('脱机版本已下载');
      }

      function showToast(msg) {
        let t = document.getElementById('toast');
        if (!t) {
          t = document.createElement('div');
          t.id = 'toast';
          t.style.cssText =
            'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--bg3);color:var(--text);padding:10px 20px;border-radius:8px;border:1px solid var(--border);font-size:13px;z-index:9999;opacity:0;transition:opacity 0.3s;pointer-events:none;';
          document.body.appendChild(t);
        }
        t.textContent = msg;
        t.style.opacity = '1';
        clearTimeout(t._timer);
        t._timer = setTimeout(() => {
          t.style.opacity = '0';
        }, 2500);
      }

      function updateClock() {
        const now = new Date();
        const h = String(now.getHours()).padStart(2, '0');
        const m = String(now.getMinutes()).padStart(2, '0');
        const s = String(now.getSeconds()).padStart(2, '0');
        document.getElementById('clockDisplay').textContent = `${h}:${m}:${s}`;
      }

      /* ══════════════════════════════════════════════════
   Init
   ══════════════════════════════════════════════════ */
      function init() {
        renderSidebar();
        renderStats();
        renderFilterBar();
        renderDashboard('all');
        updateClock();
        setInterval(updateClock, 1000);

        // Keyboard shortcut: Cmd/Ctrl + K 聚焦搜索
        document.addEventListener('keydown', (e) => {
          if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
            e.preventDefault();
            document.getElementById('sbSearchInput').focus();
          }
          // ESC 关闭移动端侧栏
          if (e.key === 'Escape') {
            const sb = document.getElementById('sidebar');
            const ov = document.getElementById('sbOverlay');
            if (sb.classList.contains('show')) {
              sb.classList.remove('show');
              ov.classList.remove('active');
            }
          }
        });

        // 窗口尺寸变化时同步侧栏状态
        window.addEventListener('resize', () => {
          const sb = document.getElementById('sidebar');
          const ov = document.getElementById('sbOverlay');
          const main = document.getElementById('main');
          if (window.innerWidth > 768) {
            // 切到桌面：清除移动端状态
            ov.classList.remove('active');
            sb.classList.remove('show');
          } else {
            // 切到移动端：清除桌面折叠状态
            sb.classList.remove('hidden');
            main.classList.remove('full');
          }
        });

        // 移动端点击导航项后自动关闭侧栏
        document.getElementById('sbNav').addEventListener('click', (e) => {
          if (window.innerWidth <= 768) {
            const sb = document.getElementById('sidebar');
            const ov = document.getElementById('sbOverlay');
            if (e.target.closest('.sb-item')) {
              sb.classList.remove('show');
              ov.classList.remove('active');
            }
          }
        });

        // 移动端左滑关闭侧栏
        let touchStartX = 0;
        const sidebar = document.getElementById('sidebar');
        sidebar.addEventListener(
          'touchstart',
          (e) => {
            touchStartX = e.touches[0].clientX;
          },
          { passive: true }
        );
        sidebar.addEventListener(
          'touchend',
          (e) => {
            const dx = e.changedTouches[0].clientX - touchStartX;
            if (dx < -50 && window.innerWidth <= 768) {
              const sb = document.getElementById('sidebar');
              const ov = document.getElementById('sbOverlay');
              sb.classList.remove('show');
              ov.classList.remove('active');
            }
          },
          { passive: true }
        );
      }

      init();
    </script>
  </body>
</html>
